name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # The helper targets .NET Framework 4.8: it only runs on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Install npm dependencies
        run: npm ci

      # The same build as the published one.
      - name: Build the .NET helper
        run: npm run build:runtimes

      - name: Build the TypeScript package
        run: npm run build

      - name: Run tests
        run: npm test
